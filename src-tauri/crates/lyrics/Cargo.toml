[package]
name = "sinfonic-lyrics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LRCLIB lyrics lookup client with in-memory LRU cache"

[dependencies]
sinfonic-domain = { workspace = true }

# HTTP
reqwest = { workspace = true }

# Serde
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Error types
thiserror = { workspace = true }

# LRU cache (in-memory; bounded so we never leak a stale response
# from an unbounded growing map)
lru = "0.12"

# Synchronisation
parking_lot = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true }
serde_json = { workspace = true }
