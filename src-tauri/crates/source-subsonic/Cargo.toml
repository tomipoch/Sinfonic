[package]
name = "sinfonic-source-subsonic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Subsonic/Navidrome MusicProvider implementation (v0.2)"

[dependencies]
sinfonic-domain = { workspace = true }
sinfonic-source = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
url = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures = { workspace = true }
log = "0.4"
md5 = { workspace = true }
hex = { workspace = true }
rand = "0.8"
# Tauri is used only to emit progress events during long fan-out
# operations (the `tracks()` page fetches). The crate still builds and
# tests without a Tauri runtime — AppHandle is `Option<…>` and the
# `tauri::Emitter` trait is only invoked when the handle is present.
tauri = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
