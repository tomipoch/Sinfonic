[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["tomipoch"]
license = "MIT"
repository = "https://github.com/tomipoch/Sinfonic"
rust-version = "1.77"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
async-trait = "0.1"
futures = "0.3"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
url = "2"

# Hashing (Subsonic auth)
md5 = "0.7"
hex = "0.4"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Secrets
keyring = "3"

# Synchronisation primitives (faster, non-poisoning Mutexes for hot paths)
parking_lot = "0.12"

# Filesystem (Phase 8 — local-files provider)
walkdir = "2"
# Audio metadata parsing (Phase 8 — local-files provider). lofty 0.21 ships
# MP3/FLAC/OGG/Opus/MP4/WAV behind default features; the only opt-in feature
# is `id3v2_compression_support`, which we don't need for a reader.
lofty = "0.21"

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"

# Local workspace crates
sinfonic-domain = { path = "crates/domain" }
sinfonic-source = { path = "crates/source" }
sinfonic-source-jellyfin = { path = "crates/source-jellyfin" }
sinfonic-source-subsonic = { path = "crates/source-subsonic" }
sinfonic-source-local = { path = "crates/source-local" }
sinfonic-playback = { path = "crates/playback" }
sinfonic-library = { path = "crates/library" }
sinfonic-secrets = { path = "crates/secrets" }
sinfonic-lastfm = { path = "crates/lastfm" }

# ─────────────────────────────────────────────────────────────
# Tauri app package (root)
# ─────────────────────────────────────────────────────────────

[package]
name = "sinfonic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Sinfonic - cross-platform desktop music client"

[lib]
# The `_lib` suffix avoids Windows bin/lib name conflict (cargo#8519)
name = "sinfonic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sinfonic"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
md5 = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }

# Local workspace members
sinfonic-domain = { workspace = true }
sinfonic-source = { workspace = true }
sinfonic-source-jellyfin = { workspace = true }
sinfonic-source-subsonic = { workspace = true }
sinfonic-source-local = { workspace = true }
sinfonic-playback = { workspace = true }
sinfonic-library = { workspace = true }
sinfonic-secrets = { workspace = true }
sinfonic-lastfm = { workspace = true }
